<title>Workaut App</title>
<style>
:root {
  --bg:#f4f4f5; --card:#fff; --text:#171717; --muted:#737373;
  --line:#e5e5e5; --accent:#111; --done:#e9f7ee; --doneText:#207a3d;
  --header-h:140px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; }
body {
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);
  overscroll-behavior-y:none;
}
button, .tab, input, a { touch-action:manipulation; }
header {
  background:#111; color:white;
  padding:calc(20px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) 18px calc(18px + env(safe-area-inset-left,0px));
  position:sticky; top:0; z-index:10;
}
.header-row { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.auth-screen {
  min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center;
  padding:20px calc(20px + env(safe-area-inset-right,0px)) 20px calc(20px + env(safe-area-inset-left,0px));
}
.auth-card { background:white; border:1px solid var(--line); border-radius:18px; padding:24px; width:100%; max-width:360px; }
.auth-card h1 { margin:0 0 2px; font-size:22px; display:flex; align-items:center; gap:8px; }
.app-logo { width:26px; height:26px; border-radius:7px; vertical-align:middle; }
.auth-card .subtitle { color:var(--muted); font-size:13px; margin-bottom:18px; }
.auth-card label { margin-top:12px; }

.auth-error.ok { background:#e9f7ee; color:#207a3d; }
.auth-divider { display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--muted); font-size:12px; }
.auth-divider::before, .auth-divider::after { content:""; flex:1; height:1px; background:var(--line); }
.google-btn {

}
.auth-user-bar {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:12px; color:#bbb; padding-top:4px;
}
.auth-logout { background:transparent; border:none; color:#ddd; text-decoration:underline; padding:2px 4px; font-weight:700; font-size:12px; }
h1 { font-size:24px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
.subtitle { color:#aaa; font-size:13px; }
.date { margin-top:14px; font-size:13px; color:#ccc; }
.tabs {
  display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding:12px calc(14px + env(safe-area-inset-right,0px)) 12px calc(14px + env(safe-area-inset-left,0px));
  background:white; border-bottom:1px solid var(--line);
  position:sticky; top:var(--header-h); z-index:9;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  border:1px solid var(--line); background:white; border-radius:999px;
  padding:9px 13px; white-space:nowrap; font-weight:700; font-size:13px;
  user-select:none; position:relative;
}
.tab.active { background:#111; color:white; border-color:#111; }
.next-dot {
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:#2563eb; margin-left:6px; vertical-align:middle;
}
.tab.active .next-dot { background:#7dd3fc; }
main { max-width:760px; margin:auto; padding:16px calc(14px + env(safe-area-inset-right,0px)) 40px calc(14px + env(safe-area-inset-left,0px)); }
.day-title { font-size:25px; font-weight:800; margin:6px 0 2px; }
.day-focus { color:var(--muted); margin-bottom:16px; }
.progress-wrap {
  background:white; border:1px solid var(--line); border-radius:14px;
  padding:12px 14px; margin-bottom:14px;
}
.progress-top { display:flex; justify-content:space-between; font-size:13px; font-weight:700; }

.progress-fill { height:100%; width:0; background:#111; border-radius:99px; transition:.2s; }
.section-title {
  font-size:14px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); font-weight:800; margin:20px 4px 8px;
}
.exercise {
  background:var(--card); border:1px solid var(--line); border-radius:15px;
  padding:14px; margin-bottom:10px; transition:.15s;
}
.exercise.done { background:var(--done); border-color:#c9ead3; }
.exercise-head { display:flex; align-items:flex-start; gap:10px; }
.check-wrap { display:flex; align-items:center; justify-content:center; padding:8px; margin:-8px; flex:0 0 auto; }
.check {
  -webkit-appearance:none; appearance:none;
  width:26px; height:26px; margin:0; border:2px solid #ccc; border-radius:8px;
  background:white; position:relative; cursor:pointer; flex:0 0 auto;
}
.check:checked { background:#111; border-color:#111; }
.check:checked::after {
  content:""; position:absolute; left:7px; top:3px; width:7px; height:13px;
  border:solid white; border-width:0 3px 3px 0; transform:rotate(45deg);
}
.name-wrap { flex:1 1 auto; min-width:0; }
.name { font-weight:750; font-size:16px; line-height:1.25; }
.muscle { color:var(--muted); font-size:12px; margin-top:3px; }
.howto {
  flex:0 0 auto; background:#f2f2f2; border:1px solid var(--line);

}

}
.cal-ex-comment { font-size:11px; color:var(--muted); margin:-4px 0 8px 2px; font-style:italic; }
label { font-size:11px; color:var(--muted); font-weight:700; display:block; }
input[type=number] {
  width:100%; margin-top:4px; border:1px solid #d9d9d9; border-radius:10px;
  padding:10px; font-size:16px; background:#fafafa;
}
.actions { display:flex; gap:8px; margin:18px 0 0; }
button {
  border:0; border-radius:11px; padding:11px 13px; font-weight:750;

}

}

.cal-month-label { font-weight:800; font-size:18px; text-transform:capitalize; }

.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-cell {

.cal-picker-label { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:800; margin-bottom:10px; }
.cal-picker-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.cal-picker-btn { border:1px solid var(--line); background:#fafafa; border-radius:11px; padding:11px 10px; font-size:13px; font-weight:700; text-align:center; }

}
.cal-detail { background:white; border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:16px; }
.cal-detail-date { font-weight:800; font-size:15px; margin-bottom:6px; text-transform:capitalize; }

  font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:800;
  margin:12px 0 6px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;
}

.cal-ex-row { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }

  syncWorkoutsFromActivePlan();
}
function getActivePlan() {
  return state.plans.find(p=>p.id===state.activePlanId) || state.plans[0];

function syncWorkoutsFromActivePlan() {
  workouts = getActivePlan().days;
  if(currentDay >= workouts.length) currentDay = 0;

  if(state.plans.length <= 1){ showToast("Você precisa ter ao menos um treino."); return; }

  state.plans = state.plans.filter(p=>p.id!==planId);
  if(state.activePlanId === planId){
    state.activePlanId = state.plans[0].id;
    syncWorkoutsFromActivePlan();
    currentDay = 0;
    userPickedDay = false;

  save();
  render();
}

function saveBuilderPlan() {
  if(!builderDraft.days.length){ showToast("Adicione ao menos um dia."); return; }
  for(const d of builderDraft.days){
    if(!d.exercises.length){ showToast("Cada dia precisa de ao menos um exercício."); return; }
  }
  const planId = "plan_" + Date.now();
  const days = builderDraft.days.map((d,i) => {
    const dayName = d.name || ("Dia " + (i+1));
    return {
      id: planId + "_d" + i,
      title: dayName,
      short: dayName.split(" ")[0].slice(0,10),
      focus: d.muscleGroups.join(", "),
      sections: [ { name: "", exercises: d.exercises.map(e => e.libId ? [e.name, e.muscle, e.libId] : [e.name, e.muscle]) } ]
    };
  });

function getNextWorkoutIndex() {
  const logged = [];
  Object.keys(history).forEach(dk => {
    (history[dk]||[]).forEach(entry => {
      if(!entry.isRest && entry.dayId){
        logged.push({date:dk, savedAt:entry.savedAt||"", dayId:entry.dayId});
      }
    });
  });
  if(!logged.length) return 0;
  logged.sort((a,b) => {
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.savedAt < b.savedAt ? -1 : 1;
  });
  const last = logged[logged.length-1];
  const idx = workouts.findIndex(w => w.id === last.dayId);
  return idx === -1 ? 0 : (idx+1) % workouts.length;
}

let db = null;
let stateDirty = false;
let historyDirty = false;

async function initDb() {
  if(!window.claude) return;
  try { db = await window.claude.use("db"); } catch(e) { db = null; }
  if(!db) return;
  try {
    const [stateSnap, histSnap] = await Promise.all([
      db.doc("data/state").get(),
      db.doc("data/history").get()
    ]);
    // Only adopt the cloud copy if the user hasn't already saved something
    // locally while this fetch was in flight (avoids clobbering a fresh save).
    // Clone the data: snapshots from the cloud store are frozen, so
    // assigning them directly would silently block later edits
    // (adding a new day, deleting a rest day, etc).
    if(!stateDirty && stateSnap.exists) state = JSON.parse(JSON.stringify(stateSnap.data() || {}));
    if(!historyDirty && histSnap.exists) history = JSON.parse(JSON.stringify(histSnap.data() || {}));
    ensurePlans();
    if(!userPickedDay){
      if(state.__lastTabDate === dateKey(new Date()) && typeof state.__lastTabIndex === "number"){
        currentDay = state.__lastTabIndex;
        userPickedDay = true;
      } else {
        currentDay = getNextWorkoutIndex();
      }
    }
  } catch(e) { /* keep local data as fallback */ }
  render();
}

function key(dayId, sectionIndex, exerciseIndex) {
  return dayId + "_" + sectionIndex + "_" + exerciseIndex;
}
function getItem(k) {
  const raw = state[k];
  if(!raw) return {done:false, comment:"", stale:false, sets:[{weight:"",reps:""}]};
  if(!Array.isArray(raw.sets)){
    // migrate legacy single weight/reps shape
    return {done:!!raw.done, comment:raw.comment||"", stale:!!raw.stale, sets:[{weight:raw.weight||"", reps:raw.reps||""}]};
  }
  return {done:!!raw.done, comment:raw.comment||"", stale:!!raw.stale, sets: raw.sets.length ? raw.sets : [{weight:"",reps:""}]};
}
function ensureItem(k) {
  const item = getItem(k);
  state[k] = item;
  return item;
}
function setField(k, field, value) {
  const item = ensureItem(k);
  item[field] = value;
  item.stale = false;
  save();
  render();
}
function setSetField(k, idx, field, value) {
  const item = ensureItem(k);
  item.sets[idx][field] = value;
  item.stale = false;
  save();
}
function addSet(k) {
  const item = ensureItem(k);
  const firstReps = item.sets.length ? item.sets[0].reps : "";
  item.sets.push({weight:"", reps:firstReps});
  save();
  render();
}
function removeSet(k, idx) {
  const item = ensureItem(k);
  if(item.sets.length <= 1) return;
  item.sets.splice(idx, 1);
  save();
  render();
}
function getCardio(dayId) {
  return { type: state[dayId+"_cardioType"] || "", time: state[dayId+"_cardioTime"] || "" };
}
function setCardioField(field, value) {
  const w = workouts[currentDay];
  state[w.id + (field==="type" ? "_cardioType" : "_cardioTime")] = value;
  save();
}
function escapeHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function attrJSON(v) {
  // Safe to embed inside a double-quoted HTML onclick="" attribute:
  // JSON.stringify's own double quotes would otherwise close the attribute early.
  return JSON.stringify(v).replace(/"/g, "&quot;");
}
function dateKey(d) {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

let toastTimer;
function showToast(msg) {
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

function classifyMuscle(raw) {
  if(MUSCLE_GROUPS.includes(raw)) return [raw];
  const stopWords = ["upper","mid","lower","front","rear"];
  return String(raw).split("/").map(p => p.trim()).map(p => {
    const low = p.toLowerCase();
    if(stopWords.includes(low)) return null;
    if(low.includes("delt")) return "Ombros";
    if(low.includes("chest")) return "Peito";
    if(low.includes("tricep")) return "Tríceps";
    if(low.includes("bicep") || low.includes("brachialis")) return "Bíceps";
    if(low.includes("lat") || low.includes("back")) return "Costas";
    if(low.includes("quad") || low.includes("hamstring") || low.includes("glute") || low.includes("calv")) return "Perna";
    if(low.includes("forearm") || low.includes("trap")) return "Antebraço/Trapézio";
    if(low.includes("abdomin")) return "Abdômen";
    return p;
  }).filter(Boolean);
}

function getMuscleGroupCounts() {
  const counts = {};
  MUSCLE_GROUPS.forEach(g => { counts[g] = 0; });
  Object.keys(history).forEach(dk => {
    (history[dk]||[]).forEach(entry => {
      (entry.exercises||[]).forEach(ex => {
        if(!ex.muscle) return;
        classifyMuscle(ex.muscle).forEach(g => { counts[g] = (counts[g]||0) + 1; });
      });
      if(entry.cardio && entry.cardio.type){
        counts["Cardio"] = (counts["Cardio"]||0) + 1;
      }
    });
  });
  return counts;
}

function renderCalendarView() {
  document.getElementById("tabs").style.display = "none";
  const year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = dateKey(new Date());

  let cells = "";
  for(let i=0;i<startWeekday;i++){ cells += `<div class="cal-cell empty"></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dstr = dateKey(new Date(year, month, d));
    const entries = history[dstr];
    const hasData = !!(entries && entries.length);
    const isRestDay = !!(entries && entries.length === 1 && entries[0].isRest);
    const hasPB = !!(entries && entries.some(e=>e.hasPB));
    const isToday = dstr === todayStr;
    const isFuture = dstr > todayStr;
    const isSelected = dstr === selectedCalendarDate;
    if(isFuture){
      cells += `<div class="cal-cell future"><span>${d}</span></div>`;
    } else {
      cells += `<button class="cal-cell ${hasData?'has-data':''} ${isRestDay?'is-rest':''} ${isToday?'is-today':''} ${isSelected?'is-selected':''}" onclick="selectCalendarDate('${dstr}')">
        <span>${d}</span>${hasData?`<span class="cal-dot ${isRestDay?'rest-dot':''}"></span>`:''}${hasPB?'<span class="cal-fire">🔥</span>':''}
      </button>`;
    }
  }

  let detailHtml = "";
  if(selectedCalendarDate){
    const entries = history[selectedCalendarDate];
    const isPastOrToday = selectedCalendarDate <= todayStr;
    const niceDate = new Date(selectedCalendarDate+"T00:00:00").toLocaleDateString(undefined,{weekday:"long", year:"numeric", month:"long", day:"numeric"});
    if(entries && entries.length && entries[0].isRest){
      detailHtml = `<div class="cal-detail"><div class="cal-detail-date">${niceDate}</div><div class="small-note rest-note">😴 Dia de descanso</div></div>`;
    } else if(entries && entries.length){
      detailHtml = `<div class="cal-detail"><div class="cal-detail-date">${niceDate}</div>`;
      entries.forEach((entry,idx)=>{
        const hasBody = (entry.exercises && entry.exercises.length) || (entry.cardio && entry.cardio.type);
        const entryOpen = !!calendarOpenEntries[selectedCalendarDate+"::"+idx];
        detailHtml += `<div class="cal-detail-workout" ${hasBody?`onclick="toggleCalendarEntry('${selectedCalendarDate}',${idx})"`:''}>
          <span>${escapeHtml(entry.title)}${entry.hasPB?' 🔥':''}</span>
          ${hasBody?`<span class="report-caret ${entryOpen?'open':''}">▸</span>`:''}
        </div>`;
        if(!hasBody){
          detailHtml += `<div class="small-note">Registrado manualmente</div>`;
        } else if(entryOpen){
          if(entry.exercises && entry.exercises.length){
            entry.exercises.forEach(ex=>{
              detailHtml += renderExerciseRow(ex);
            });
          }
          if(entry.cardio && entry.cardio.type){
            detailHtml += `<div class="cal-ex-row">
              <div class="cal-ex-name">🏃 ${escapeHtml(entry.cardio.type)}</div>
              <div class="cal-ex-stats">${entry.cardio.time?escapeHtml(entry.cardio.time)+' min':'—'}</div>
            </div>`;
          }
        }
      });
      detailHtml += `</div>`;
    } else {
      detailHtml = `<div class="cal-detail"><div class="cal-detail-date">${niceDate}</div><div class="small-note">Nenhum treino registrado nesse dia.</div></div>`;
    }
    if(isPastOrToday){
      const isRestNow = !!(entries && entries.length===1 && entries[0].isRest);
      const activeDayIds = (entries && !isRestNow) ? entries.map(e=>e.dayId) : [];
      const realDayIds = (entries && !isRestNow) ? entries.filter(e=>e.exercises && e.exercises.length).map(e=>e.dayId) : [];
      const hasAnyReal = realDayIds.length > 0;
      detailHtml += `<div class="cal-picker">
        <div class="cal-picker-label">Registrar neste dia</div>
        <div class="cal-picker-grid">

            const isActive = activeDayIds.includes(w.id);

          }).join("")}
          <button class="cal-picker-btn rest ${isRestNow?'active':''} ${hasAnyReal?'locked':''}"
            ${hasAnyReal?'title="Já há treino salvo neste dia"':`onclick="toggleRestForDate('${selectedCalendarDate}')"`}>😴 Marcar como descanso</button>
        </div>
        <div class="small-note">Toque novamente em uma opção marcada para remover. Treinos salvos em "Salvar progresso" (🔒) só podem ser editados pela aba de treino.</div>
      </div>`;
    }
  }

  document.getElementById("app").innerHTML = `
    <div class="cal-nav">
      <button class="secondary" onclick="changeMonth(-1)">‹</button>

function toggleWorkoutForDate(dstr, dayId) {
  const w = workouts.find(x => x.id === dayId);
  if(!w) return;
  const entries = history[dstr] || [];
  const idx = entries.findIndex(e => !e.isRest && e.dayId === dayId);
  if(idx >= 0){
    if(entries[idx].exercises && entries[idx].exercises.length){
      showToast("Esse treino foi salvo em 'Salvar progresso' — edite pela aba de treino.");
      return;
    }
    entries.splice(idx,1);
    if(entries.length) history[dstr] = entries; else delete history[dstr];
    showToast("Removido do calendário");
  } else {
    const kept = entries.filter(e => !e.isRest);
    kept.push({dayId:w.id, title:w.title, exercises:[], savedAt:new Date().toISOString()});
    history[dstr] = kept;
    showToast("Treino registrado ✓");
  }
  saveHistoryData();
  render();
}

function toggleRestForDate(dstr) {
  const entries = history[dstr] || [];
  const hasReal = entries.some(e => e.exercises && e.exercises.length);
  if(hasReal){
    showToast("Já há treino salvo neste dia — não é possível marcar descanso.");
    return;
  }
  const isRestNow = entries.length===1 && entries[0].isRest;
  if(isRestNow){
    delete history[dstr];
    showToast("Removido do calendário");
  } else {
    history[dstr] = [{isRest:true, title:"Descanso", savedAt:new Date().toISOString()}];
    showToast("Dia marcado como descanso ✓");
  }
  saveHistoryData();
  render();
}

function getExerciseSets(ex) {
  if(Array.isArray(ex.sets)) return ex.sets;
  if(ex.weight !== undefined || ex.reps !== undefined) return [{weight:ex.weight, reps:ex.reps}];
  return [];
}

function formatSets(ex) {
  const sets = getExerciseSets(ex);
  if(!sets.length) return "—";
  return sets.map(st => `${st.weight?escapeHtml(st.weight)+'kg':'—'}×${st.reps?escapeHtml(st.reps):'—'}`).join(" · ");
}

function renderExerciseRow(ex) {
  let html = `<div class="cal-ex-row">
    <div class="cal-ex-name">${ex.isPB?'🔥 ':''}${escapeHtml(ex.name)}</div>
    <div class="cal-ex-stats">${formatSets(ex)}</div>
  </div>`;
  if(ex.comment){
    html += `<div class="cal-ex-comment">💬 ${escapeHtml(ex.comment)}</div>`;
  }
  return html;
}

function getPreviousBestWeight(exerciseName) {
  let best = null;
  Object.keys(history).forEach(dk => {
    (history[dk]||[]).forEach(entry => {
      (entry.exercises||[]).forEach(ex => {
        if(ex.name === exerciseName){
          getExerciseSets(ex).forEach(st => {
            const w = parseFloat(String(st.weight).replace(",", "."));
            if(!isNaN(w) && (best === null || w > best)) best = w;
          });
        }
      });
    });
  });
  return best;
}

function saveProgress() {
  const w = workouts[currentDay];
  const dk = dateKey(new Date());
  if(!history[dk]) history[dk] = [];
  const idx = history[dk].findIndex(entry => entry.dayId === w.id);
  // Start from whatever was already saved for this workout today, so a
  // correction to one exercise never erases the others.
  const exerciseMap = {};
  if(idx >= 0 && history[dk][idx].exercises){
    history[dk][idx].exercises.forEach(ex => { exerciseMap[ex.name] = ex; });
  }

  w.sections.forEach((s,si)=>s.exercises.forEach((e,ei)=>{
    const item = getItem(key(w.id,si,ei));
    if(item.done){
      const cleanSets = item.sets.filter(st => st.weight!=="" || st.reps!=="");
      const setsToSave = cleanSets.length ? cleanSets : item.sets;
      const prevBest = getPreviousBestWeight(e[0]);
      const weightsThisSave = setsToSave
        .map(st => parseFloat(String(st.weight).replace(",", ".")))
        .filter(n => !isNaN(n));
      const maxWeightThisSave = weightsThisSave.length ? Math.max(...weightsThisSave) : null;
      const isPB = maxWeightThisSave !== null && prevBest !== null && maxWeightThisSave > prevBest;
      exerciseMap[e[0]] = {name:e[0], muscle:e[1], comment:item.comment||"", sets:setsToSave, isPB};
    }
  }));

  const doneExercises = Object.values(exerciseMap);
  const cardio = getCardio(w.id);
  const hasCardio = !!cardio.type;
  if(doneExercises.length === 0 && !hasCardio){
    showToast("Marque ao menos um exercício ou registre o cardio antes de salvar.");
    return;
  }
  const anyPB = doneExercises.some(ex => ex.isPB);
  const entry = {dayId:w.id, title:w.title, exercises:doneExercises, savedAt:new Date().toISOString(), hasPB:anyPB};
  if(hasCardio) entry.cardio = {type:cardio.type, time:cardio.time};
  else if(idx >= 0 && history[dk][idx].cardio) entry.cardio = history[dk][idx].cardio;
  if(idx >= 0) history[dk][idx] = entry; else history[dk].push(entry);
  saveHistoryData();

  // Uncheck the boxes for next time, but keep the weights/sets/reps as a
  // faded reminder of last time's numbers, until the person edits them.
  w.sections.forEach((s,si)=>s.exercises.forEach((e,ei)=>{
    const it = ensureItem(key(w.id,si,ei));
    it.done = false;
    it.stale = true;
  }));
  save();

  // Jump straight to the next workout in the sequence.
  currentDay = (currentDay + 1) % workouts.length;
  userPickedDay = true;
  state.__lastTabDate = dk;
  state.__lastTabIndex = currentDay;
  save();

  showToast(anyPB ? "Progresso salvo — novo recorde pessoal! 🔥" : "Progresso salvo no calendário ✓");
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function setHeaderHeight() {
  const h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--header-h", h + "px");
}
window.addEventListener("resize", setHeaderHeight);
window.addEventListener("orientationchange", setHeaderHeight);

document.getElementById("today").textContent =
  new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});

setHeaderHeight();
updateHeaderButtons();
render();
initFirebaseAuth();
</script>
</body>
